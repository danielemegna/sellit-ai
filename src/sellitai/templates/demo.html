<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Sell It AI - Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin: 16px 0 6px;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #4361ee;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #3551d6;
        }

        #result {
            margin-top: 28px;
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #4361ee;
            background: #eef2ff;
            border: 2px solid #4361ee;
            border-radius: 12px;
            padding: 24px;
            word-break: break-word;
            display: none;
        }

        #result.loading {
            font-size: 18px;
            color: #666;
            background: #f4f5f7;
            border-color: #ccc;
        }

        #result.error {
            font-size: 18px;
            color: #b00020;
            background: #fdecec;
            border-color: #b00020;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sell It AI - Categorizzazione</h1>

        <label for="product_name">Nome prodotto</label>
        <input type="text" id="product_name" placeholder="es. Macchina da caffè Magnifica Evo">

        <label for="product_description">Descrizione prodotto</label>
        <textarea id="product_description" rows="10" placeholder="Inserisci qui la descrizione del prodotto..."></textarea>

        <label for="ecommerce">Piattaforma</label>
        <select id="ecommerce">
            <option value="SUBITO">SUBITO</option>
            <option value="VINTED">VINTED</option>
        </select>

        <button id="submit">Categorizza</button>

        <div id="result"></div>
    </div>

    <script>
        const submit = document.getElementById("submit");
        const result = document.getElementById("result");

        submit.addEventListener("click", async () => {
            const payload = {
                product_name: document.getElementById("product_name").value,
                product_description: document.getElementById("product_description").value,
                categories: document.getElementById("ecommerce").value,
            };

            result.className = "loading";
            result.textContent = "Categorizzazione in corso...";
            result.style.display = "block";

            try {
                const response = await fetch("/categorize", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const text = await response.text();
                if (!response.ok) {
                    throw new Error(text);
                }

                result.className = "";
                result.textContent = text;
            } catch (err) {
                result.className = "error";
                result.textContent = "Errore: " + err.message;
            }
        });
    </script>
</body>
</html>
