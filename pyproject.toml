[project]
name = "sellitai"
version = "0.1.0"
description = "Sell It on the Web with AI"
authors = [{name = "danielemegna"}]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "flask>=3.1.3",
]

[project.scripts]
main = "sellitai.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sellitai*"]

